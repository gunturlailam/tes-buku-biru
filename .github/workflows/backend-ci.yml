name: Backend CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profitai
          POSTGRES_PASSWORD: change_me_local_only
          POSTGRES_DB: profitai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Alembic migrations
      env:
        DATABASE_URL: postgresql+psycopg://profitai:change_me_local_only@localhost:5432/profitai
      run: |
        cd backend
        alembic upgrade head

    - name: Run Pytest test suite
      env:
        DATABASE_URL: postgresql+psycopg://profitai:change_me_local_only@localhost:5432/profitai
        PYTHONPATH: backend
      run: |
        pytest backend/tests/ -v

