# Optional local PostgreSQL service. Adjust credentials/ports for your environment.
services:
  db:
    image: postgres:16
    container_name: profitai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: profitai
      POSTGRES_USER: profitai
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - profitai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitai -d profitai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  profitai_postgres_data:
